<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a1a3d"><meta name="description" content="Complete Bharatiya Vyapar Mahotsav 2026 field guide with schedules, contacts, opportunity maps, scripts, checklists and an interactive lead tracker."><meta property="og:title" content="Bharatiya Vyapar Mahotsav 2026 — Complete Field Guide"><meta property="og:description" content="A practical event playbook with schedules, contacts, opportunities, scripts, checklists and a lead tracker."><title>Bharatiya Vyapar Mahotsav 2026 — Complete Field Guide</title><style>html,body{height:100%;margin:0;background:#07162f;color:#fff;font:600 16px/1.5 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot{min-height:100%;display:grid;place-items:center;padding:28px;box-sizing:border-box}.box{max-width:620px;text-align:center}.mark{width:64px;height:64px;margin:0 auto 20px;border-radius:18px;background:linear-gradient(145deg,#ffb11f,#f56b2a);display:grid;place-items:center;color:#07162f;font-weight:900;box-shadow:0 18px 50px rgba(245,107,42,.35)}h1{font-size:clamp(25px,4vw,42px);line-height:1.1;letter-spacing:-.04em;margin:0 0 12px}p{color:#b8c5df;margin:0}.bar{height:7px;max-width:360px;margin:24px auto 0;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}.bar:after{content:"";display:block;width:38%;height:100%;border-radius:inherit;background:#ffb11f;animation:move 1s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(165%)}}button{margin-top:20px;border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer}</style></head><body><main class="boot" id="boot"><div class="box"><div class="mark">BVM</div><h1>Opening your complete field guide</h1><p>Loading schedules, contacts, opportunity maps and the interactive lead tracker…</p><div class="bar" aria-hidden="true"></div></div></main><script>(async()=>{const urls=['https://raw.githubusercontent.com/raghavbadhwar/product-prototypes-2025/bvm-2026-field-guide/bvm-2026/payload-a.txt','https://raw.githubusercontent.com/raghavbadhwar/product-prototypes-2025/bvm-2026-field-guide/bvm-2026/payload-b.txt'];try{if(!('DecompressionStream'in window))throw new Error('Please open this guide in a current version of Chrome, Safari, Edge or Firefox.');const rs=await Promise.all(urls.map(u=>fetch(u,{cache:'force-cache'})));if(rs.some(r=>!r.ok))throw new Error('One of the guide files could not be loaded.');const b64=(await Promise.all(rs.map(r=>r.text()))).join('').replace(/\s/g,'');const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();const hash=location.hash;document.open();document.write(html);document.close();if(hash)setTimeout(()=>document.getElementById(hash.slice(1))?.scrollIntoView(),150)}catch(error){document.getElementById('boot').innerHTML='<div class="box"><div class="mark">!</div><h1>Guide could not open</h1><p>'+String(error.message||error).replace(/[<>&]/g,'')+'</p><button onclick="location.reload()">Retry</button></div>'}})();</script></body></html>
